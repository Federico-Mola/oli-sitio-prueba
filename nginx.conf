# Solo el proxy local de Hostinger/Traefik puede aportar la IP original.
geo $oli_ingreso_confiable {
    default 0;
    172.19.0.1 1;
    10.11.0.7 1;
}
map "$oli_ingreso_confiable:$http_x_real_ip" $oli_ip_visitante {
    default $remote_addr;
    ~^1:(?<oli_ip_original>.+)$ $oli_ip_original;
}
limit_req_zone $oli_ip_visitante zone=oli_atencion:1m rate=30r/m;
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;
    gzip on;
    gzip_types text/css application/javascript image/svg+xml;
    gzip_min_length 512;
    error_page 404 /404.html;
    location ^~ /carga-oli/api/ {
        location = /carga-oli/api/archivo { proxy_pass http://127.0.0.1:8091/api/subida; }
        location = /carga-oli/api/finalizar { proxy_pass http://127.0.0.1:8091/api/subida/finalizar; }
        client_max_body_size 100m;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
        proxy_request_buffering off;
        proxy_set_header X-Oli-Key "";
        add_header Cache-Control "no-store" always;
        add_header Referrer-Policy "no-referrer" always;
    }
    location ^~ /carga-oli/ {
        try_files $uri $uri/index.html =404;
        add_header Cache-Control "no-store" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self'; img-src 'self'; base-uri 'none'; frame-ancestors 'none'; form-action 'none'" always;
    }
    # Conversación pública, separada de la API del bot de carga.
    location = /oli-asistente/api/chat {
        limit_req zone=oli_atencion burst=8 nodelay;
        limit_req_status 429;
        error_page 429 = @oli_atencion_limite;
        include /etc/nginx/oli-agent-proxy.conf;
    }
    location = /oli-asistente/api/sesion {
        limit_req zone=oli_atencion burst=8 nodelay;
        limit_req_status 429;
        error_page 429 = @oli_atencion_limite;
        include /etc/nginx/oli-agent-proxy.conf;
    }
    location ^~ /oli-asistente/ {
        include /etc/nginx/oli-agent-proxy.conf;
    }
    location @oli_atencion_limite {
        default_type application/json;
        return 429 '{"error":"esperar"}';
    }
    # Servicio interno del bot (oli_api.py). Protegido con la clave X-Oli-Key.
    location /api/ { proxy_pass http://127.0.0.1:8091; proxy_set_header Host $host; proxy_read_timeout 300s; proxy_send_timeout 300s; client_max_body_size 25m; add_header Cache-Control "no-store"; }
    # Fotos de los modelos, guardadas por el bot en /data/media/modelos
    location ^~ /media/modelos/ { alias /data/media/modelos/; add_header Cache-Control "public, max-age=86400"; }
    location / { try_files $uri $uri/index.html $uri.html =404; add_header Cache-Control "public, max-age=60, must-revalidate"; }
    location ~* \.(webp|woff2|mp4|css)$ { add_header Cache-Control "public, max-age=2592000"; }
}
