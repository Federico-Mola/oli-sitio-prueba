server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;
    gzip on;
    gzip_types text/css application/javascript image/svg+xml;
    gzip_min_length 512;
    error_page 404 /404.html;
    # Servicio interno del bot (oli_api.py). Protegido con la clave X-Oli-Key.
    location /api/ { proxy_pass http://127.0.0.1:8091; proxy_set_header Host $host; client_max_body_size 25m; add_header Cache-Control "no-store"; }
    location / { try_files $uri $uri/index.html $uri.html =404; add_header Cache-Control "public, max-age=600"; }
    location ~* \.(webp|woff2|mp4|css)$ { add_header Cache-Control "public, max-age=2592000"; }
}
