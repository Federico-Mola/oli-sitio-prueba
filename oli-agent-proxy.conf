rewrite ^/oli-asistente/(.*)$ /$1 break;
proxy_pass http://oli-agente:8094;
proxy_set_header Host www.latienditadeoli.com;
proxy_set_header X-Forwarded-Proto https;
proxy_set_header X-Oli-Client-IP $oli_ip_visitante;
client_max_body_size 7k;
proxy_connect_timeout 3s;
proxy_read_timeout 45s;
proxy_send_timeout 10s;
proxy_buffering off;
add_header Cache-Control "no-store";
